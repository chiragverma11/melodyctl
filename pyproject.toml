[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "melodyctl"
version = "1.4.0"
description = "Control HeyMelody-family earbuds (OPPO Enco / OnePlus Buds) from Linux over the OPOv1/RFCOMM protocol: battery, gestures, game mode, ANC (where supported)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chirag Verma" }]
keywords = ["oppo", "enco", "oneplus", "bluetooth", "rfcomm", "spp", "heymelody", "linux"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
melodyctl = "melodyctl.cli:main"

[tool.setuptools.packages.find]
include = ["melodyctl*"]

[tool.setuptools.package-data]
melodyctl = ["data/*.json"]
